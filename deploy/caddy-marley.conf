# Caddyfile completo del HOST en MARLEY (/etc/caddy/Caddyfile)
# sofy se queda; Patel se suma. Luego: caddy validate --config /etc/caddy/Caddyfile && systemctl reload caddy

sofy.visorlab.study {
    encode gzip
    reverse_proxy 127.0.0.1:3000
}

patel.visorlab.study {
    encode gzip
    reverse_proxy 127.0.0.1:3010
}
